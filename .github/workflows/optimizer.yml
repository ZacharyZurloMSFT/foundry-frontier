name: Prompt Optimizer (nightly)
# Runs the Foundry Prompt Optimizer + Agent Optimizer against each Northwind
# Insurance agent prompt under agents/insurance/ using the golden dataset. When
# the optimizer finds a variant that beats baseline by >= OPTIMIZER_MIN_LIFT on
# the rubric evaluator, it opens a PR with the improved prompt. A human reviews
# the PR; evals/baseline.json only changes with reviewer approval.
on:
  schedule:
    - cron: "0 6 * * *"    # nightly 06:00 UTC
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent key (triage, policy_claim_lookup, policy_wording, claim_action_draft, orchestrator, or 'all')"
        default: "all"
        required: true
      min_lift:
        description: "Minimum score lift over baseline to open a PR"
        default: "0.05"
        required: true

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        agent: [triage, claim_action_draft]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: azure/login@v3
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: pip install -r pipelines/optimizer/requirements.txt
      - name: Optimize ${{ matrix.agent }}
        id: opt
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_JUDGE_DEPLOYMENT: gpt-5.4
          OPTIMIZER_MIN_LIFT: ${{ inputs.min_lift || '0.05' }}
        run: |
          python pipelines/optimizer/run_prompt_optimizer.py \
            --agent ${{ matrix.agent }} \
            --dataset data/golden/dataset.jsonl \
            --baseline evals/baseline.json \
            --report optimizer-report-${{ matrix.agent }}.json
      - name: Open PR when a better prompt was found
        if: steps.opt.outputs.improved == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(optimizer): promote ${{ matrix.agent }} prompt (+${{ steps.opt.outputs.lift }})"
          title: "🧠 Optimizer: ${{ matrix.agent }} +${{ steps.opt.outputs.lift }} vs baseline"
          body: |
            The nightly Prompt Optimizer found a variant of the **${{ matrix.agent }}**
            prompt that beat baseline by **${{ steps.opt.outputs.lift }}** on the
            rubric evaluator.

            - Golden set: `data/golden/dataset.jsonl`
            - Judge model: `gpt-5.4`
            - Report: attached as workflow artifact
            - Prompt file: `${{ steps.opt.outputs.prompt_path }}`

            All four eval tiers will re-run when you push a commit to this branch.
          branch: optimizer/${{ matrix.agent }}
          labels: optimizer, needs-review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: optimizer-${{ matrix.agent }}
          path: optimizer-report-${{ matrix.agent }}.json
