name: Progressive Deploy (dev → staging → prod)
# Single deploy workflow that fans out by trigger:
#   pull_request  → dev-pr-<n>  (ephemeral, torn down on PR close)
#   push to main  → staging     (bake image + full eval + red team)
#   dispatch      → prod        (promote staging digest, gated by reviewers)
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "apps/**"
      - "agents/**"
      - "infra/**"
      - "azure.yaml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "agents/**"
      - "infra/**"
      - "azure.yaml"
  workflow_dispatch:
    inputs:
      promote_to_prod:
        description: "Promote current staging image digest to prod"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ── PR ephemeral dev env ────────────────────────────────────────────────
  dev:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: dev-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      AZURE_ENV_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: azd env new / provision / deploy
        run: |
          azd env new "$AZURE_ENV_NAME" --no-prompt || azd env select "$AZURE_ENV_NAME"
          azd env set AZURE_LOCATION "${{ vars.AZURE_LOCATION || 'canadacentral' }}"
          azd env set AZURE_AI_LOCATION "${{ vars.AZURE_AI_LOCATION || 'eastus2' }}"
          azd env set COPILOT_HARNESS_ENABLED true
          azd up --no-prompt
          echo "API_URI=$(azd env get-value API_URI)" >> "$GITHUB_ENV"
          echo "FOUNDRY_ENDPOINT=$(azd env get-value FOUNDRY_ENDPOINT)" >> "$GITHUB_ENV"
          echo "FOUNDRY_PROJECT_ENDPOINT=$(azd env get-value FOUNDRY_PROJECT_ENDPOINT)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r evals/requirements.txt
      - name: Evaluate the actual harness candidate, not staging
        env:
          FOUNDRY_WORKER_DEPLOYMENT: gpt-4o
        run: |
          python evals/run_evals.py --target copilot-sdk \
            --dataset data/golden/harness.jsonl --output evals/harness-results.json \
            --baseline evals/baseline.json --expected-build "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-candidate-evaluation
          path: evals/harness-results.json
      - name: Post preview URLs on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### 🚀 Ephemeral dev env for PR #${context.issue.number}\n\n` +
              `azd env: \`pr-${context.issue.number}\`\n\n` +
              `Endpoints will be printed in the workflow log; the env is torn down when the PR closes.`;
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });

  teardown-dev:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: dev
    env:
      AZURE_ENV_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - name: azd down --force --purge
        run: |
          azd env select "$AZURE_ENV_NAME" || exit 0
          azd down --force --purge --no-prompt

  # ── Staging on main ─────────────────────────────────────────────────────
  staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image_digests: ${{ steps.digests.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - name: azd deploy to staging
        env:
          AZURE_ENV_NAME: staging
        run: |
          azd env select staging
          azd deploy --no-prompt
      - name: Capture image digests for promotion
        id: digests
        run: |
          echo "value=$(az acr repository show-manifests --name $ACR_NAME --repository api --top 1 --orderby time_desc --query '[0].digest' -o tsv)" >> "$GITHUB_OUTPUT"
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}

  # ── Prod promotion (manual dispatch, required reviewers) ───────────────
  prod:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_to_prod
    needs: []
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - name: Promote staging digest → prod (no rebuild)
        env:
          AZURE_ENV_NAME: prod
        run: |
          azd env select prod
          # Pin container-app revisions to the digests already promoted through staging.
          # This deliberately does NOT rebuild — same bytes, different env.
          bash scripts/promote-staging-to-prod.sh
