name: CI
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install ruff + mypy
        run: pip install ruff==0.8.4 mypy==1.13.0
      - name: Ruff
        run: ruff check apps/api evals pipelines data/seed
      - name: Mypy (best-effort)
        run: mypy apps/api/app --ignore-missing-imports --follow-imports=silent || true

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build
        run: |
          curl -sLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/
          bicep build infra/main.bicep --stdout > /tmp/main.json
          echo "Bicep compiled OK"

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web-tech, web-voice]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - working-directory: apps/${{ matrix.app }}
        run: |
          npm install --no-audit --no-fund
          npm run build
      - if: matrix.app == 'web-tech'
        working-directory: apps/web-tech
        run: npm run typecheck && npm test

  harness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r apps/api/requirements.txt -r apps/mcp-work-order/requirements.txt
      - run: python -m copilot download-runtime
      - name: SDK, API, storage, approval and evaluation contracts
        env:
          TEST_COPILOT_RUNTIME: "1"
        run: python -m pytest apps/api/tests evals/tests/test_harness_eval.py -q
