name: Smoke Eval (Tier 1)
# 60-second sanity check on every PR. Uses the free GitHub Models endpoint
# (models.inference.ai.azure.com) with the built-in ${{ secrets.GITHUB_TOKEN }}
# so it needs zero Azure credentials and never burns Foundry quota.
#
# Fails fast if a prompt change is obviously broken (blank output, malformed
# JSON from triage, missing required fields from work_order_draft, etc).
on:
  pull_request:
    paths:
      - "agents/**"
      - "apps/api/**"
      - "evals/**"
      - "data/golden/**"
      - "apps/mcp-work-order/**"

permissions:
  contents: read
  pull-requests: write
  models: read  # required to call GitHub Models

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx==0.28.1 pydantic==2.9.2 pyyaml==6.0.2
      - name: Run smoke eval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_MODEL: openai/gpt-4o-mini
        run: python evals/smoke_eval.py --output smoke-results.json
      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = "### 🟢 Tier-1 smoke eval\n\n";
            try {
              const r = JSON.parse(fs.readFileSync('smoke-results.json', 'utf8'));
              const rows = r.cases.map(c =>
                `| ${c.workflow} | ${c.pass ? '✅' : '❌'} | ${c.reason || ''} |`
              ).join('\n');
              body += `Model: \`${r.model}\`  ·  passed **${r.passed}/${r.total}** in ${r.elapsed_ms}ms\n\n`;
              body += `| Workflow | Result | Reason |\n|---|---|---|\n${rows}\n`;
              if (r.passed < r.total) body = "### 🔴 Tier-1 smoke eval\n\n" + body.slice(body.indexOf('\n'));
            } catch (e) {
              body += `⚠️ smoke eval crashed — see workflow logs.`;
            }
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-eval-results
          path: smoke-results.json
