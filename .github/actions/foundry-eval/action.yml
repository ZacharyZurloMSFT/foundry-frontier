name: "foundry-eval"
description: "Run the Northwind Insurance golden-set evaluator against the deployed API (POST /insurance/chat) and post the diff vs baseline."
inputs:
  dataset:
    description: "Path to the golden JSONL dataset"
    required: true
    default: "data/golden/dataset.jsonl"
  baseline:
    description: "Path to baseline.json for the regression gate"
    required: false
    default: "evals/baseline.json"
  api_uri:
    description: "Deployed insurance API endpoint under test (ca-insurance-api)"
    required: true
  expected_build:
    description: "Exact deployed candidate Git SHA; stale staging is not evaluation evidence"
    required: true
  foundry_endpoint:
    description: "Foundry AI Services endpoint"
    required: true
  foundry_project_endpoint:
    description: "Foundry project endpoint"
    required: true
  worker_deployment:
    description: "Worker model deployment name"
    required: false
    default: "gpt-4o"
  output:
    description: "Where to write results.json"
    required: false
    default: "evals/results.json"

outputs:
  results_path:
    description: "Path to the JSON results"
    value: ${{ steps.run.outputs.results_path }}
  regressed:
    description: "true if any metric regressed vs baseline"
    value: ${{ steps.run.outputs.regressed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }
    - name: Install eval deps
      shell: bash
      run: pip install -r evals/requirements.txt
    - name: Run Foundry evaluators
      id: run
      shell: bash
      env:
        API_URI: ${{ inputs.api_uri }}
        FOUNDRY_ENDPOINT: ${{ inputs.foundry_endpoint }}
        FOUNDRY_PROJECT_ENDPOINT: ${{ inputs.foundry_project_endpoint }}
        FOUNDRY_WORKER_DEPLOYMENT: ${{ inputs.worker_deployment }}
        EXPECTED_BUILD: ${{ inputs.expected_build }}
        EVAL_OUTPUT: ${{ inputs.output }}
      run: |
        test -n "$EXPECTED_BUILD" || { echo "expected_build is required" >&2; exit 2; }
        set +e
        python evals/run_evals.py \
          --dataset "${{ inputs.dataset }}" \
          --output  "${{ inputs.output }}" \
          --baseline "${{ inputs.baseline }}" \
          --expected-build "$EXPECTED_BUILD"
        status=$?
        set -e
        echo "results_path=${{ inputs.output }}" >> "$GITHUB_OUTPUT"
        python - <<'PY'
        import json, os
        with open(os.environ["EVAL_OUTPUT"], encoding="utf-8") as stream:
            result = json.load(stream)
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
            stream.write("regressed=" + str(bool(result.get("regressions"))).lower() + "\n")
        PY
        exit "$status"
