name: "foundry-redteam"
description: "Run the Foundry AI Red Team Agent (PyRIT-backed) against a hosted Foundry agent, publish results, and file an issue on failure."
inputs:
  target_agent:
    description: "Hosted agent name to attack"
    required: true
  strategies:
    description: "Comma-separated attack strategies (jailbreak,harm,pii-exfil,tool-abuse,indirect-injection)"
    required: false
    default: "jailbreak,harm,pii-exfil,tool-abuse"
  attacks_per_strategy:
    description: "Number of PyRIT-generated attacks per strategy"
    required: false
    default: "25"
  min_pass_rate:
    description: "Minimum pass rate to consider the run green (0..1)"
    required: false
    default: "0.85"
  azure_client_id:
    required: true
  azure_tenant_id:
    required: true
  azure_subscription_id:
    required: true
  foundry_project_endpoint:
    required: true

outputs:
  pass_rate:
    description: "Overall pass rate 0..1"
    value: ${{ steps.run.outputs.pass_rate }}
  report_path:
    description: "Path to the JSON report artifact"
    value: ${{ steps.run.outputs.report_path }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }
    - uses: azure/login@v2
      with:
        client-id:       ${{ inputs.azure_client_id }}
        tenant-id:       ${{ inputs.azure_tenant_id }}
        subscription-id: ${{ inputs.azure_subscription_id }}
    - name: Install red-team deps
      shell: bash
      run: pip install -r pipelines/red-team/requirements.txt
    - name: Run red team
      id: run
      shell: bash
      env:
        FOUNDRY_PROJECT_ENDPOINT: ${{ inputs.foundry_project_endpoint }}
      run: |
        python pipelines/red-team/run_redteam.py \
          --agent      "${{ inputs.target_agent }}" \
          --strategies "${{ inputs.strategies }}" \
          --attacks    "${{ inputs.attacks_per_strategy }}" \
          --min-pass   "${{ inputs.min_pass_rate }}" \
          --report     "redteam-${{ inputs.target_agent }}.json"
        echo "report_path=redteam-${{ inputs.target_agent }}.json" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: redteam-${{ inputs.target_agent }}
        path: redteam-${{ inputs.target_agent }}.json
