name: Eval regression
description: File a regression when an evaluator, a red-team report or a production trace fails
title: "[eval-regression] <metric> regressed on <workflow>"
labels: ["eval-regression", "needs-triage", "copilot-fix"]
body:
  - type: markdown
    attributes:
      value: |
        File this by hand when an evaluator, a red-team report or a bad trace
        shows a regression (the automatic drift detector was retired). The GitHub
        Copilot coding agent picks up issues labelled `copilot-fix`
        (see `.github/copilot-setup-steps.yml`) and drafts a fix PR seeded with
        the failing trace payload.
  - type: input
    id: workflow
    attributes: { label: Workflow, description: "e.g. triage, work_order_draft, orchestrator" }
    validations: { required: true }
  - type: input
    id: metric
    attributes: { label: Metric, description: "e.g. Groundedness, WorkOrderCompleteness, RedTeamPassRate" }
    validations: { required: true }
  - type: input
    id: trace_id
    attributes: { label: App Insights trace id }
  - type: input
    id: prompt_sha
    attributes: { label: Prompt git SHA that shipped this behavior }
  - type: textarea
    id: failing_input
    attributes: { label: Failing input (from trace) }
  - type: textarea
    id: failing_output
    attributes: { label: Failing output (from trace) }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior / rubric criterion violated }
