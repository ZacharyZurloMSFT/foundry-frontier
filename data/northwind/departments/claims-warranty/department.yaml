seed_dir: seed
golden_path: golden/dataset.jsonl
prompts_dir: prompts
cu_analyzer_dir: cu-analyzers

agents:
  hosted: []
  prompt:
    - northwind-claims-triage

corpus_theme: |
  Fictional Northwind Insurance auto claims: typed and handwritten FNOL,
  policy schedules and endorsements, repair estimates, invoices and
  supporting damage evidence. Extract source facts, identifiers, loss dates,
  amounts and missing/uncertain fields with source references. Never infer
  definitive cause, fault, fraud, coverage or eligibility from documents/photos.
