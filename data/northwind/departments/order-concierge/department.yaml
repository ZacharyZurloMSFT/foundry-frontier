schema_version: 1
slug: order-concierge
name: "Claims Concierge"
tagline: "Auto claims and policy records with safe, human-reviewed action drafts."
pillar: multi_agent
icon: "🚘"
brand_color: "#0b6bcb"
foundry_project: northwind-orders
search_index: northwind-insurance-knowledge
cu_inbox_prefix: order-concierge
enabled_tabs: [insurance_records, agent_chat, work_orders, hitl]
customer_archetype: "Claims leaders, adjusters, policyholder servicing teams."

# The flagship reuses the pre-existing top-level assets so `azd up` keeps
# working during the phased rollout. A later phase physically relocates
# these files under data/northwind/departments/order-concierge/.
seed_dir: ../../../seed                 # -> data/seed
golden_path: ../../../golden/dataset.jsonl  # -> data/golden/dataset.jsonl
prompts_dir: ../../../../agents          # -> agents/
cu_analyzer_dir: ../../../../pipelines/content-understanding

agents:
  hosted:
    - name: northwind-orchestrator
      path: ../../../../agents/orchestrator
    - name: northwind-triage
      path: ../../../../agents/triage
    - name: northwind-order-lookup
      path: ../../../../agents/orderlookup
    - name: northwind-policy-lookup
      path: ../../../../agents/policylookup
    - name: northwind-resolution-draft
      path: ../../../../agents/resolutiondraft
  prompt: []

# Order Concierge owns the platform-wide bake-off + safety demos. This is a
# demo-only decision; a future rev may spin a dedicated `nw-platform` project.
hosts_platform_tabs: [bakeoff, safety]
