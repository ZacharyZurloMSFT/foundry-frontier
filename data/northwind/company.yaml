# Northwind Insurance — fictional P&C insurer; stable legacy resource identifiers.
#
# This manifest is the top of the "one company, four Foundry projects" story.
# Each department listed here becomes:
#   - a Foundry project inside the shared AI Services account
#     (see infra/modules/foundry.bicep once the multi-project change lands)
#   - a landing-page tile in the web-tech app
#   - an AI Search index (nw-<slug>)
#   - a Cosmos partition (department = <slug>)
#   - a `cu-inbox/<slug>/` blob prefix
#
# Paths under each department are relative to the repo root. During the phased
# rollout, the Order Concierge department reuses the pre-existing top-level
# `data/seed/`, `data/golden/`, and `agents/` paths so `azd up` never breaks;
# the three new departments start with their own subtrees under
# `data/northwind/departments/<slug>/`.

schema_version: 1

company:
  slug: northwind
  name: "Northwind Insurance"
  tagline: "Auto claims, grounded evidence, human decisions. One Foundry account."
  brand_color: "#0b6bcb"
  hero: |
    Northwind Insurance is a fictional property-and-casualty insurer.
    Follow an auto claim from first notice of loss through evidence review
    and a human-reviewed action draft. All records and policy forms are
    synthetic; the demo never approves or denies coverage or executes payments.
    Four departments share Azure AI Foundry capabilities: grounded retrieval,
    document intelligence, Voice Live, orchestration, safety and observability.

# Cross-cutting Foundry capabilities that live in the platform header nav
# regardless of which department the SE is demoing.
platform_tabs:
  - id: agent_harness
    label: "Agent Harness"
    hosted_in_project: nw-insurance-claims
  - id: bakeoff
    label: "🏁 Model bake-off"
    hosted_in_project: nw-insurance-claims
  - id: safety
    label: "🛡 Try to jailbreak"
    hosted_in_project: nw-insurance-claims

# Departments — order here is the order of tiles on the landing page.
departments:
  - slug: order-concierge
    name: "Claims Concierge"
    tagline: "Auto claims and policy records with safe, human-reviewed action drafts."
    pillar: multi_agent
    icon: "🚘"
    brand_color: "#0b6bcb"
    foundry_project: nw-insurance-claims
    search_index: northwind-insurance-knowledge
    cu_inbox_prefix: order-concierge
    enabled_tabs: [insurance_records, agent_chat, work_orders, hitl]
    # Order Concierge is the flagship — it reuses the existing top-level dirs
    # until the physical move happens in a later phase.
    seed_dir: data/seed
    golden_path: data/golden/dataset.jsonl
    prompts_dir: agents
    cu_analyzer_dir: pipelines/content-understanding
    customer_archetype: "Claims leaders, adjusters, policyholder servicing teams."

  - slug: employee-help-desk
    name: "Employee & Adjuster Support"
    tagline: "Grounded HR and IT support plus adjuster procedures and review boundaries."
    pillar: rag
    icon: "📚"
    brand_color: "#2e7d32"
    foundry_project: nw-insurance-support
    search_index: nw-hr
    cu_inbox_prefix: employee-help-desk
    enabled_tabs: [hr_chat]
    seed_dir: data/northwind/departments/employee-help-desk/seed
    golden_path: data/northwind/departments/employee-help-desk/golden/dataset.jsonl
    prompts_dir: data/northwind/departments/employee-help-desk/prompts
    cu_analyzer_dir: null
    customer_archetype: "HR ops, IT service desk, adjuster enablement teams."

  - slug: claims-warranty
    name: "Claims Document Intelligence"
    tagline: "FNOL reports, repair estimates, supporting invoices and damage evidence."
    pillar: content_understanding
    icon: "📄"
    brand_color: "#ef6c00"
    foundry_project: nw-insurance-documents
    search_index: nw-claims
    cu_inbox_prefix: claims-warranty
    enabled_tabs: [claims_inbox]
    seed_dir: data/northwind/departments/claims-warranty/seed
    golden_path: data/northwind/departments/claims-warranty/golden/dataset.jsonl
    prompts_dir: data/northwind/departments/claims-warranty/prompts
    cu_analyzer_dir: data/northwind/departments/claims-warranty/cu-analyzers
    customer_archetype: "Claims processing, compliance, intake operations."

  - slug: contact-center
    name: "Policyholder Contact Center"
    tagline: "Policyholder intake, claim-status conversations and adjuster handoff."
    pillar: voice_live
    icon: "📞"
    brand_color: "#6a1b9a"
    foundry_project: nw-insurance-contact-center
    search_index: nw-contact-center
    cu_inbox_prefix: contact-center
    enabled_tabs: [voice_console]
    seed_dir: data/northwind/departments/contact-center/seed
    golden_path: data/northwind/departments/contact-center/golden/dataset.jsonl
    prompts_dir: data/northwind/departments/contact-center/prompts
    cu_analyzer_dir: null
    customer_archetype: "Contact center director, CX / call intake leader."
