name: northwind-insurance-policy-wording
kind: hosted
description: Cited insurance policy wording through the insurance Foundry IQ connection.
protocols:
  - protocol: responses
    version: 2.0.0
environment_variables:
  - name: NORTHWIND_BUSINESS_DOMAIN
    value: insurance
  - name: AGENT_ROLE
    value: policy_wording
  - name: MODEL_DEPLOYMENT_NAME
    value: ${MODEL_DEPLOYMENT_NAME}
  - name: MODEL_GATEWAY_ENDPOINT
    value: ${MODEL_GATEWAY_ENDPOINT}
  - name: MODEL_GATEWAY_MODEL
    value: ${INSURANCE_GATEWAY_SPECIALIST_MODEL}
  - name: MODEL_GATEWAY_DEPLOYMENT
    value: ${MODEL_DEPLOYMENT_NAME}
  - name: AZURE_SEARCH_ENDPOINT
    value: ${AZURE_SEARCH_ENDPOINT}
  - name: AZURE_SEARCH_KNOWLEDGE_BASE
    value: ${AZURE_SEARCH_KNOWLEDGE_BASE}
  - name: AZURE_SEARCH_INDEX
    value: ${AZURE_SEARCH_INDEX}
  - name: INSURANCE_KB_CONNECTION_NAME
    value: ${INSURANCE_KB_CONNECTION_NAME}
resources:
  cpu: "1.0"
  memory: 2Gi
