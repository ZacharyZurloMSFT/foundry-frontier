# AgentDefinition for the Northwind orchestrator hosted agent.
# Format: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-yaml-reference
# (AgentDefinition — top-level `kind: hosted` makes this a ContainerAgent.)
name: northwind-orchestrator
kind: hosted
description: >
  Manager of the Northwind Order Concierge multi-agent flow. Coordinates
  the four Order Concierge prompt agents (triage, order-lookup,
  policy-lookup, resolution-draft) hosted in the same Foundry project,
  plus the resolution-approver / inventory agents via Connected Agents.
  Same manager is reused as the brain behind the future Voice Live
  call-center front door — the only thing that changes is the transport.
metadata:
  tags:
    - Northwind
    - Agent Framework
    - Foundry Hosted
protocols:
  - protocol: responses
    version: 2.0.0
environment_variables:
  # FOUNDRY_PROJECT_ENDPOINT is injected automatically by the runtime.
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: ORDERS_MODEL_GATEWAY_ENDPOINT
    value: ${ORDERS_MODEL_GATEWAY_ENDPOINT}
  - name: ORDERS_MODEL_GATEWAY_MODEL
    value: ${ORDERS_MODEL_GATEWAY_MODEL}
  - name: ORDERS_MODEL_GATEWAY_DEPLOYMENT
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: FOUNDRY_AGENT_TRIAGE_ID
    value: ${FOUNDRY_AGENT_TRIAGE_ID}
  - name: FOUNDRY_AGENT_TECH_LOOKUP_ID
    value: ${FOUNDRY_AGENT_TECH_LOOKUP_ID}
  - name: FOUNDRY_AGENT_MANUAL_RETRIEVAL_ID
    value: ${FOUNDRY_AGENT_MANUAL_RETRIEVAL_ID}
  - name: FOUNDRY_AGENT_WORK_ORDER_DRAFT_ID
    value: ${FOUNDRY_AGENT_WORK_ORDER_DRAFT_ID}
  - name: AZURE_SEARCH_ENDPOINT
    value: ${AZURE_SEARCH_ENDPOINT}
  - name: AZURE_SEARCH_INDEX
    value: ${AZURE_SEARCH_INDEX}
resources:
  cpu: "1.0"
  memory: 2Gi
