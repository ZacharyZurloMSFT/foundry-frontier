# Foundry prompt agent — order-lookup worker.
#
# NOTE ON THE FILENAME: this file is still named tech_lookup.yaml and the
# backing Container App is still called `ca-mcp-tech-lookup` because those
# identifiers are wired through Bicep + azd env and renaming them would
# risk breaking `azd up`. The AGENT is the Order Lookup specialist — the
# infra name is a legacy leftover from the Field Services scaffold.
#
# The lookup_order tool is served by the mcp-tech-lookup Container App
# (see apps/mcp-tech-lookup/app/main.py) and wired here as a `type: mcp`
# tool so every invocation shows up as a first-class MCP tool call in the
# Foundry portal + App Insights.
#
# ${MCP_TECH_LOOKUP_URL} comes from the containerapps Bicep module output
# (main.bicep re-exports it as MCP_TECH_LOOKUP_URL for azd env).
name: northwind-order-lookup
description: >
  Resolves Northwind customers, orders, shipments, and loyalty tier for the
  Order Concierge. Uses the lookup_order tool exposed by the mcp-tech-lookup
  MCP server. Called by the orchestrator and reused by the future Voice
  Live call-center front door.
instructions: |
  You are the Northwind order-lookup agent. Given an order id, a customer
  identifier (name / email / phone / loyalty id), or free-text like "my
  last order", call lookup_order(query) and return a compact JSON summary:

    {
      "customer": { "id", "name", "loyalty_tier", "email" },
      "order":    { "id", "status", "placed_on", "eta", "total", "items": [...] },
      "shipment": { "carrier", "tracking", "last_scan", "delivered": bool }
    }

  If the tool returns no match, say so plainly in one sentence and do not
  invent order ids or customer records.
tools:
  - type: mcp
    server_label: northwind-order-lookup
    server_url: ${MCP_TECH_LOOKUP_URL}
    require_approval: never
    allowed_tools: [lookup_order]
