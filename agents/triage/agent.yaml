name: northwind-insurance-triage
kind: hosted
policies:
  - type: rai_policy
    rai_policy_name: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_FOUNDRY_RESOURCE_GROUP}/providers/Microsoft.CognitiveServices/accounts/aisvc-zurlo-northwind/raiPolicies/Microsoft.DefaultV2
description: Hosted insurance triage using the canonical insurance prompt and a configurable model.
protocols:
  - protocol: responses
    version: 2.0.0
environment_variables:
  - name: NORTHWIND_BUSINESS_DOMAIN
    value: insurance
  - name: AGENT_ROLE
    value: triage
  - name: MODEL_DEPLOYMENT_NAME
    value: ${MODEL_DEPLOYMENT_NAME}
  - name: AZURE_OPENAI_ENDPOINT
    value: ${AZURE_OPENAI_ENDPOINT}
  - name: MODEL_GATEWAY_ENDPOINT
    value: ${MODEL_GATEWAY_ENDPOINT}
  - name: MODEL_GATEWAY_MODEL
    value: ${INSURANCE_GATEWAY_SPECIALIST_MODEL}
  - name: MODEL_GATEWAY_DEPLOYMENT
    value: ${MODEL_DEPLOYMENT_NAME}
  # Add TRIAGE_MODEL_DEPLOYMENT only when an existing candidate is selected.
  # Unset means baseline, not a fine-tuned model or a training request.
resources:
  cpu: "1.0"
  memory: 2Gi
