name: northwind-triage
kind: hosted
policies:
  - type: rai_policy
    rai_policy_name: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_FOUNDRY_RESOURCE_GROUP}/providers/Microsoft.CognitiveServices/accounts/aisvc-zurlo-northwind/raiPolicies/northwind-orders-guardrail-v1
description: Hosted Order Concierge triage using the canonical triage.yaml prompt and a configurable model.
protocols:
  - protocol: responses
    version: 2.0.0
environment_variables:
  - name: NORTHWIND_BUSINESS_DOMAIN
    value: retail
  - name: NORTHWIND_INSURANCE_AGENTS_READY
    value: "false"
  - name: ORDER_AGENT_ROLE
    value: triage
  - name: MODEL_DEPLOYMENT_NAME
    value: ${MODEL_DEPLOYMENT_NAME}
  - name: ORDERS_OPENAI_ENDPOINT
    value: ${ORDERS_OPENAI_ENDPOINT}
  - name: ORDERS_MODEL_GATEWAY_ENDPOINT
    value: ${ORDERS_MODEL_GATEWAY_ENDPOINT}
  - name: ORDERS_MODEL_GATEWAY_MODEL
    value: ${ORDERS_GATEWAY_SPECIALIST_MODEL}
  - name: ORDERS_MODEL_GATEWAY_DEPLOYMENT
    value: ${MODEL_DEPLOYMENT_NAME}
  - name: AI_GATEWAY_REQUIRED
    value: ${AI_GATEWAY_REQUIRED}
  - name: AI_GATEWAY_MCP_REQUIRED
    value: ${AI_GATEWAY_MCP_REQUIRED}
  - name: ORDERS_MCP_GATEWAY
    value: ${ORDERS_MCP_GATEWAY}
  # Add TRIAGE_MODEL_DEPLOYMENT only when an existing candidate is selected.
  # Unset means baseline, not a fine-tuned model or a training request.
resources:
  cpu: "1.0"
  memory: 2Gi
