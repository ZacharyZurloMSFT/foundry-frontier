name: northwind-orchestrator
kind: hosted
description: Agent Framework manager delegating to four independently hosted Order Concierge specialists.
protocols:
  - protocol: responses
    version: 2.0.0
environment_variables:
  - name: NORTHWIND_BUSINESS_DOMAIN
    value: retail
  - name: NORTHWIND_INSURANCE_AGENTS_READY
    value: "false"
  - name: ORDER_AGENT_ROLE
    value: manager
  - name: MODEL_DEPLOYMENT_NAME
    value: ${MODEL_DEPLOYMENT_NAME}
  - name: ORDERS_MODEL_GATEWAY_ENDPOINT
    value: ${ORDERS_MODEL_GATEWAY_ENDPOINT}
  - name: ORDERS_MODEL_GATEWAY_MODEL
    value: ${ORDERS_GATEWAY_MANAGER_MODEL}
  - name: ORDERS_MODEL_GATEWAY_DEPLOYMENT
    value: ${MODEL_DEPLOYMENT_NAME}
  - name: ORDERS_TRIAGE_AGENT_NAME
    value: northwind-triage
  - name: ORDERS_ORDER_LOOKUP_AGENT_NAME
    value: northwind-order-lookup
  - name: ORDERS_POLICY_LOOKUP_AGENT_NAME
    value: northwind-policy-lookup
  - name: ORDERS_RESOLUTION_DRAFT_AGENT_NAME
    value: northwind-resolution-draft
resources:
  cpu: "1.0"
  memory: 2Gi
