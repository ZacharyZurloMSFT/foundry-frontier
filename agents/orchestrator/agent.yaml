name: northwind-insurance-orchestrator
kind: hosted
description: Insurance manager delegating to four independently hosted insurance specialists.
protocols:
  - protocol: responses
    version: 2.0.0
environment_variables:
  - name: NORTHWIND_BUSINESS_DOMAIN
    value: insurance
  - name: AGENT_ROLE
    value: orchestrator
  - name: MODEL_DEPLOYMENT_NAME
    value: ${MODEL_DEPLOYMENT_NAME}
  - name: MODEL_GATEWAY_ENDPOINT
    value: ${MODEL_GATEWAY_ENDPOINT}
  - name: MODEL_GATEWAY_MODEL
    value: ${INSURANCE_GATEWAY_ORCHESTRATOR_MODEL}
  - name: MODEL_GATEWAY_DEPLOYMENT
    value: ${MODEL_DEPLOYMENT_NAME}
  - name: INSURANCE_TRIAGE_AGENT_NAME
    value: northwind-insurance-triage
  - name: INSURANCE_LOOKUP_AGENT_NAME
    value: northwind-insurance-policy-claim-lookup
  - name: INSURANCE_POLICY_AGENT_NAME
    value: northwind-insurance-policy-wording
  - name: INSURANCE_DRAFT_AGENT_NAME
    value: northwind-insurance-claim-action-draft
resources:
  cpu: "1.0"
  memory: 2Gi
