# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: northwind-copilot
metadata:
    template: northwind-copilot@0.1.0
services:
    api:
        project: ./apps/api
        host: containerapp
        resourceGroup: ${AZURE_APPS_RESOURCE_GROUP}
        resourceName: ca-insurance-api
        language: python
        docker:
            path: Dockerfile
            remoteBuild: true
        hooks:
            prepackage:
                windows:
                    shell: pwsh
                    run: |
                        # Bundle the Northwind manifest into the API image (build context is
                        # ./apps/api). company.py picks it up from app/_northwind at runtime.
                        $dest = "app/_northwind"
                        New-Item -ItemType Directory -Force -Path $dest | Out-Null
                        Copy-Item -Recurse -Force ../../data/northwind/* $dest/
                        python ../../scripts/bundle-insurance-assets.py --service api
                        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                        python ../../scripts/bundle-harness-assets.py
                        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                posix:
                    shell: sh
                    run: |
                        set -e
                        dest="app/_northwind"
                        rm -rf "$dest"
                        mkdir -p "$dest"
                        cp -R ../../data/northwind/. "$dest/"
                        python ../../scripts/bundle-insurance-assets.py --service api
                        python ../../scripts/bundle-harness-assets.py
    mcp-policy-lookup:
        project: ./apps/mcp-policy-lookup
        host: containerapp
        resourceGroup: ${AZURE_APPS_RESOURCE_GROUP}
        resourceName: ca-insurance-lookup
        language: python
        docker:
            path: Dockerfile
            remoteBuild: true
        hooks:
            prepackage:
                windows:
                    shell: pwsh
                    run: |
                        python ../../scripts/bundle-insurance-assets.py --service mcp-policy-lookup
                        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                posix:
                    shell: sh
                    run: |
                        set -e
                        python ../../scripts/bundle-insurance-assets.py --service mcp-policy-lookup
    mcp-claim-review:
        project: ./apps/mcp-claim-review
        host: containerapp
        resourceGroup: ${AZURE_APPS_RESOURCE_GROUP}
        resourceName: ca-insurance-review
        language: python
        docker:
            path: Dockerfile
            remoteBuild: true
        hooks:
            prepackage:
                windows:
                    shell: pwsh
                    run: |
                        python ../../scripts/bundle-insurance-assets.py --service mcp-claim-review
                        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                posix:
                    shell: sh
                    run: |
                        set -e
                        python ../../scripts/bundle-insurance-assets.py --service mcp-claim-review
    web-portal:
        project: ./apps/web-portal
        host: containerapp
        resourceGroup: ${AZURE_APPS_RESOURCE_GROUP}
        resourceName: ca-insurance-portal
        language: js
        docker:
            path: Dockerfile
            remoteBuild: true
        hooks:
            prepackage:
                windows:
                    shell: pwsh
                    run: |
                        if (-not $env:VITE_API_BASE_URL -and $env:API_URI) { $env:VITE_API_BASE_URL = $env:API_URI }
                        npm install --no-audit --no-fund; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npm run build
                posix:
                    shell: sh
                    run: |
                        if [ -z "$VITE_API_BASE_URL" ] && [ -n "$API_URI" ]; then export VITE_API_BASE_URL="$API_URI"; fi
                        npm install --no-audit --no-fund && npm run build
    web-voice:
        project: ./apps/web-voice
        host: containerapp
        resourceGroup: ${AZURE_APPS_RESOURCE_GROUP}
        resourceName: ca-insurance-voice
        language: js
        docker:
            path: Dockerfile
            remoteBuild: true
        hooks:
            prepackage:
                windows:
                    shell: pwsh
                    run: |
                        if (-not $env:VITE_API_BASE_URL -and $env:API_URI) { $env:VITE_API_BASE_URL = $env:API_URI }
                        npm install --no-audit --no-fund; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npm run build
                posix:
                    shell: sh
                    run: |
                        if [ -z "$VITE_API_BASE_URL" ] && [ -n "$API_URI" ]; then export VITE_API_BASE_URL="$API_URI"; fi
                        npm install --no-audit --no-fund && npm run build
hooks:
    predeploy:
        windows:
            shell: pwsh
            run: python ./scripts/validate-reuse.py
        posix:
            shell: sh
            run: python ./scripts/validate-reuse.py
    preprovision:
        windows:
            shell: pwsh
            run: python ./scripts/validate-reuse.py
        posix:
            shell: sh
            run: python ./scripts/validate-reuse.py
