# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: northwind-copilot
metadata:
    template: northwind-copilot@0.1.0
services:
    api:
        project: ./apps/api
        host: containerapp
        resourceGroup: ${AZURE_APPS_RESOURCE_GROUP}
        resourceName: ca-api
        language: python
        docker:
            path: Dockerfile
            remoteBuild: true
        hooks:
            prepackage:
                windows:
                    shell: pwsh
                    run: |
                        # Bundle the Northwind manifest into the API image (build context is
                        # ./apps/api). company.py picks it up from app/_northwind at runtime.
                        $dest = "app/_northwind"
                        New-Item -ItemType Directory -Force -Path $dest | Out-Null
                        Copy-Item -Recurse -Force ../../data/northwind/* $dest/
                        python ../../scripts/bundle-insurance-assets.py --service api
                        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                        python ../../scripts/bundle-harness-assets.py
                        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                posix:
                    shell: sh
                    run: |
                        set -e
                        dest="app/_northwind"
                        rm -rf "$dest"
                        mkdir -p "$dest"
                        cp -R ../../data/northwind/. "$dest/"
                        python ../../scripts/bundle-insurance-assets.py --service api
                        python ../../scripts/bundle-harness-assets.py
    mcp-tech-lookup:
        project: ./apps/mcp-tech-lookup
        host: containerapp
        resourceGroup: ${AZURE_APPS_RESOURCE_GROUP}
        resourceName: ca-mcp-tech-lookup
        language: python
        docker:
            path: Dockerfile
            remoteBuild: true
        hooks:
            prepackage:
                windows:
                    shell: pwsh
                    run: |
                        python ../../scripts/bundle-insurance-assets.py --service mcp-tech-lookup
                        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                posix:
                    shell: sh
                    run: |
                        set -e
                        python ../../scripts/bundle-insurance-assets.py --service mcp-tech-lookup
    mcp-work-order:
        project: ./apps/mcp-work-order
        host: containerapp
        resourceGroup: ${AZURE_APPS_RESOURCE_GROUP}
        resourceName: ca-mcp-work-order
        language: python
        docker:
            path: Dockerfile
            remoteBuild: true
        hooks:
            prepackage:
                windows:
                    shell: pwsh
                    run: |
                        python ../../scripts/bundle-insurance-assets.py --service mcp-work-order
                        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                posix:
                    shell: sh
                    run: |
                        set -e
                        python ../../scripts/bundle-insurance-assets.py --service mcp-work-order
    orchestrator:
        project: ./agents/orchestrator
        host: azure.ai.agent
        language: python
        config:
            container:
                resources:
                    cpu: "1.0"
                    memory: 2Gi
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            Manager coordinating four independently hosted Northwind Orders specialists.
        hooks:
            prepackage:
                shell: pwsh
                run: |
                    python ../../scripts/validate-reuse.py --agent-service orchestrator
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    python ../../scripts/orders_agent_package.py --output .
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                continueOnError: false
            predeploy:
                shell: pwsh
                run: |
                    python ../../scripts/validate-reuse.py --agent-service orchestrator
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                continueOnError: false
        environmentVariables:
            - {name: NORTHWIND_BUSINESS_DOMAIN, value: "${NORTHWIND_BUSINESS_DOMAIN}"}
            - {name: NORTHWIND_INSURANCE_AGENTS_READY, value: "false"}
            - name: ORDERS_MODEL_DEPLOYMENT
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: ORDER_AGENT_ROLE
              value: manager
            - {name: ORDERS_MODEL_GATEWAY_ENDPOINT, value: "${ORDERS_MODEL_GATEWAY_ENDPOINT}"}
            - {name: ORDERS_MODEL_GATEWAY_MODEL, value: "${ORDERS_GATEWAY_MANAGER_MODEL}"}
            - {name: ORDERS_MODEL_GATEWAY_DEPLOYMENT, value: "${AZURE_AI_MODEL_DEPLOYMENT_NAME}"}
            - {name: AI_GATEWAY_REQUIRED, value: "${AI_GATEWAY_REQUIRED}"}
            - {name: AI_GATEWAY_MCP_REQUIRED, value: "${AI_GATEWAY_MCP_REQUIRED}"}
            - {name: ORDERS_MCP_GATEWAY, value: "${ORDERS_MCP_GATEWAY}"}
        kind: hosted
        name: northwind-orchestrator
        protocols:
            - protocol: responses
              version: 2.0.0
    triage:
        project: ./agents/triage
        host: azure.ai.agent
        language: python
        kind: hosted
        name: northwind-triage
        policies:
            - type: rai_policy
              raiPolicyName: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_FOUNDRY_RESOURCE_GROUP}/providers/Microsoft.CognitiveServices/accounts/aisvc-zurlo-northwind/raiPolicies/Microsoft.DefaultV2
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources: {cpu: "0.5", memory: 1Gi}
        protocols: [{protocol: responses, version: 2.0.0}]
        hooks:
            prepackage:
                shell: pwsh
                run: |
                    python ../../scripts/validate-reuse.py --agent-service triage
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    python ../../scripts/orders_agent_package.py --output .
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                continueOnError: false
            predeploy:
                shell: pwsh
                run: |
                    python ../../scripts/validate-reuse.py --agent-service triage
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                continueOnError: false
        environmentVariables:
            - {name: NORTHWIND_BUSINESS_DOMAIN, value: "${NORTHWIND_BUSINESS_DOMAIN}"}
            - {name: NORTHWIND_INSURANCE_AGENTS_READY, value: "false"}
            - {name: ORDER_AGENT_ROLE, value: triage}
            - {name: ORDERS_MODEL_DEPLOYMENT, value: "${FOUNDRY_PROMPT_AGENT_DEPLOYMENT}"}
            - {name: ORDERS_OPENAI_ENDPOINT, value: "${ORDERS_OPENAI_ENDPOINT}"}
            - {name: ORDERS_MODEL_GATEWAY_ENDPOINT, value: "${ORDERS_MODEL_GATEWAY_ENDPOINT}"}
            - {name: ORDERS_MODEL_GATEWAY_MODEL, value: "${ORDERS_GATEWAY_SPECIALIST_MODEL}"}
            - {name: ORDERS_MODEL_GATEWAY_DEPLOYMENT, value: "${FOUNDRY_PROMPT_AGENT_DEPLOYMENT}"}
            - {name: AI_GATEWAY_REQUIRED, value: "${AI_GATEWAY_REQUIRED}"}
            - {name: AI_GATEWAY_MCP_REQUIRED, value: "${AI_GATEWAY_MCP_REQUIRED}"}
            - {name: ORDERS_MCP_GATEWAY, value: "${ORDERS_MCP_GATEWAY}"}
    orderlookup:
        project: ./agents/orderlookup
        host: azure.ai.agent
        language: python
        kind: hosted
        name: northwind-order-lookup
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources: {cpu: "0.5", memory: 1Gi}
        protocols: [{protocol: responses, version: 2.0.0}]
        hooks:
            prepackage:
                shell: pwsh
                run: |
                    python ../../scripts/validate-reuse.py --agent-service orderlookup
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    python ../../scripts/orders_agent_package.py --output .
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                continueOnError: false
            predeploy:
                shell: pwsh
                run: |
                    python ../../scripts/validate-reuse.py --agent-service orderlookup
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                continueOnError: false
        environmentVariables:
            - {name: NORTHWIND_BUSINESS_DOMAIN, value: "${NORTHWIND_BUSINESS_DOMAIN}"}
            - {name: NORTHWIND_INSURANCE_AGENTS_READY, value: "false"}
            - {name: ORDER_AGENT_ROLE, value: orderlookup}
            - {name: ORDERS_MODEL_DEPLOYMENT, value: "${FOUNDRY_PROMPT_AGENT_DEPLOYMENT}"}
            - {name: MCP_TECH_LOOKUP_URL, value: "${MCP_TECH_LOOKUP_URL}"}
            - {name: ORDERS_MODEL_GATEWAY_ENDPOINT, value: "${ORDERS_MODEL_GATEWAY_ENDPOINT}"}
            - {name: ORDERS_MODEL_GATEWAY_MODEL, value: "${ORDERS_GATEWAY_SPECIALIST_MODEL}"}
            - {name: ORDERS_MODEL_GATEWAY_DEPLOYMENT, value: "${FOUNDRY_PROMPT_AGENT_DEPLOYMENT}"}
            - {name: AI_GATEWAY_REQUIRED, value: "${AI_GATEWAY_REQUIRED}"}
            - {name: AI_GATEWAY_MCP_REQUIRED, value: "${AI_GATEWAY_MCP_REQUIRED}"}
            - {name: ORDERS_MCP_GATEWAY, value: "${ORDERS_MCP_GATEWAY}"}
    policylookup:
        project: ./agents/policylookup
        host: azure.ai.agent
        language: python
        kind: hosted
        name: northwind-policy-lookup
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources: {cpu: "0.5", memory: 1Gi}
        protocols: [{protocol: responses, version: 2.0.0}]
        hooks:
            prepackage:
                shell: pwsh
                run: |
                    python ../../scripts/validate-reuse.py --agent-service policylookup
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    python ../../scripts/orders_agent_package.py --output .
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                continueOnError: false
            predeploy:
                shell: pwsh
                run: |
                    python ../../scripts/validate-reuse.py --agent-service policylookup
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                continueOnError: false
        environmentVariables:
            - {name: NORTHWIND_BUSINESS_DOMAIN, value: "${NORTHWIND_BUSINESS_DOMAIN}"}
            - {name: NORTHWIND_INSURANCE_AGENTS_READY, value: "false"}
            - {name: ORDER_AGENT_ROLE, value: policylookup}
            - {name: ORDERS_MODEL_DEPLOYMENT, value: "${FOUNDRY_PROMPT_AGENT_DEPLOYMENT}"}
            - {name: AZURE_SEARCH_ENDPOINT, value: "${AZURE_SEARCH_ENDPOINT}"}
            - {name: AZURE_SEARCH_KNOWLEDGE_BASE, value: "${AZURE_SEARCH_KNOWLEDGE_BASE}"}
            - {name: ORDERS_KB_CONNECTION_NAME, value: "${ORDERS_KB_CONNECTION_NAME}"}
            - {name: ORDERS_MODEL_GATEWAY_ENDPOINT, value: "${ORDERS_MODEL_GATEWAY_ENDPOINT}"}
            - {name: ORDERS_MODEL_GATEWAY_MODEL, value: "${ORDERS_GATEWAY_SPECIALIST_MODEL}"}
            - {name: ORDERS_MODEL_GATEWAY_DEPLOYMENT, value: "${FOUNDRY_PROMPT_AGENT_DEPLOYMENT}"}
            - {name: AI_GATEWAY_REQUIRED, value: "${AI_GATEWAY_REQUIRED}"}
            - {name: AI_GATEWAY_MCP_REQUIRED, value: "${AI_GATEWAY_MCP_REQUIRED}"}
            - {name: ORDERS_MCP_GATEWAY, value: "${ORDERS_MCP_GATEWAY}"}
    resolutiondraft:
        project: ./agents/resolutiondraft
        host: azure.ai.agent
        language: python
        kind: hosted
        name: northwind-resolution-draft
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources: {cpu: "0.5", memory: 1Gi}
        protocols: [{protocol: responses, version: 2.0.0}]
        hooks:
            prepackage:
                shell: pwsh
                run: |
                    python ../../scripts/validate-reuse.py --agent-service resolutiondraft
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    python ../../scripts/orders_agent_package.py --output .
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                continueOnError: false
            predeploy:
                shell: pwsh
                run: |
                    python ../../scripts/validate-reuse.py --agent-service resolutiondraft
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                continueOnError: false
        environmentVariables:
            - {name: NORTHWIND_BUSINESS_DOMAIN, value: "${NORTHWIND_BUSINESS_DOMAIN}"}
            - {name: NORTHWIND_INSURANCE_AGENTS_READY, value: "false"}
            - {name: ORDER_AGENT_ROLE, value: resolutiondraft}
            - {name: ORDERS_MODEL_DEPLOYMENT, value: "${FOUNDRY_PROMPT_AGENT_DEPLOYMENT}"}
            - {name: MCP_WORK_ORDER_URL, value: "${MCP_WORK_ORDER_URL}"}
            - {name: ORDERS_MODEL_GATEWAY_ENDPOINT, value: "${ORDERS_MODEL_GATEWAY_ENDPOINT}"}
            - {name: ORDERS_MODEL_GATEWAY_MODEL, value: "${ORDERS_GATEWAY_SPECIALIST_MODEL}"}
            - {name: ORDERS_MODEL_GATEWAY_DEPLOYMENT, value: "${FOUNDRY_PROMPT_AGENT_DEPLOYMENT}"}
            - {name: AI_GATEWAY_REQUIRED, value: "${AI_GATEWAY_REQUIRED}"}
            - {name: AI_GATEWAY_MCP_REQUIRED, value: "${AI_GATEWAY_MCP_REQUIRED}"}
            - {name: ORDERS_MCP_GATEWAY, value: "${ORDERS_MCP_GATEWAY}"}
    web-tech:
        project: ./apps/web-tech
        host: containerapp
        resourceGroup: ${AZURE_APPS_RESOURCE_GROUP}
        resourceName: ca-web-tech
        language: js
        docker:
            path: Dockerfile
            remoteBuild: true
        hooks:
            prepackage:
                windows:
                    shell: pwsh
                    run: |
                        if (-not $env:VITE_API_BASE_URL -and $env:API_URI) { $env:VITE_API_BASE_URL = $env:API_URI }
                        npm install --no-audit --no-fund; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npm run build
                posix:
                    shell: sh
                    run: |
                        if [ -z "$VITE_API_BASE_URL" ] && [ -n "$API_URI" ]; then export VITE_API_BASE_URL="$API_URI"; fi
                        npm install --no-audit --no-fund && npm run build
    web-voice:
        project: ./apps/web-voice
        host: containerapp
        resourceGroup: ${AZURE_APPS_RESOURCE_GROUP}
        resourceName: ca-web-voice
        language: js
        docker:
            path: Dockerfile
            remoteBuild: true
        hooks:
            prepackage:
                windows:
                    shell: pwsh
                    run: |
                        if (-not $env:VITE_API_BASE_URL -and $env:API_URI) { $env:VITE_API_BASE_URL = $env:API_URI }
                        npm install --no-audit --no-fund; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npm run build
                posix:
                    shell: sh
                    run: |
                        if [ -z "$VITE_API_BASE_URL" ] && [ -n "$API_URI" ]; then export VITE_API_BASE_URL="$API_URI"; fi
                        npm install --no-audit --no-fund && npm run build
hooks:
    predeploy:
        windows:
            shell: pwsh
            run: python ./scripts/validate-reuse.py
        posix:
            shell: sh
            run: python ./scripts/validate-reuse.py
    preprovision:
        windows:
            shell: pwsh
            run: python ./scripts/validate-reuse.py
        posix:
            shell: sh
            run: python ./scripts/validate-reuse.py
    postprovision:
        windows:
            shell: pwsh
            run: ./scripts/postprovision.ps1
        posix:
            shell: sh
            run: ./scripts/postprovision.sh
